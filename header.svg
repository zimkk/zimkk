<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
.mono { font-family: 'Courier New', Courier, monospace; }
.cursor { animation: blink 1.1s steps(1) infinite; }
.t1 { animation: fade 0.5s ease-out 0.2s both; }
.t2 { animation: fade 0.5s ease-out 0.6s both; }
.t3 { animation: fade 0.5s ease-out 1.0s both; }
.t4 { animation: fade 0.5s ease-out 1.4s both; }
.bob { animation: bob 2.2s steps(2) infinite; }
.glow { animation: glow 3s ease-in-out infinite; }
.wp { animation: wpb 2.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes bob { 50% { transform: translateY(-4px); } }
@keyframes glow { 0%,100% { opacity: 0.25; } 50% { opacity: 0.55; } }
@keyframes wpb { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
</style>
</defs>

<rect width="1600" height="560" fill="#0B0F0E"/>

<!-- stars: sparse pixels -->
<g fill="#22302a">
<rect x="180" y="70" width="4" height="4"/><rect x="520" y="40" width="4" height="4"/><rect x="820" y="90" width="4" height="4"/><rect x="1120" y="50" width="4" height="4"/><rect x="1420" y="80" width="4" height="4"/><rect x="340" y="120" width="4" height="4"/><rect x="990" y="140" width="4" height="4"/><rect x="1530" y="150" width="4" height="4"/>
</g>

<!-- top accent -->
<rect x="0" y="0" width="1600" height="4" fill="#3ECF8E"/>

<!-- LEFT: quest card -->
<g class="mono">
<text x="90" y="120" fill="#5d7268" font-size="15" class="t1" letter-spacing="4">// NEW SESSION LOADED</text>
<text x="88" y="182" fill="#ECF4EF" font-size="52" font-weight="700" letter-spacing="3" class="t1">HASSAN NAZIR</text>
<rect x="90" y="204" width="52" height="5" fill="#3ECF8E" class="t2"/>
<text x="90" y="252" fill="#3ECF8E" font-size="26" font-weight="700" letter-spacing="4" class="t2">FORWARD DEPLOYED ENGINEER</text>
<g class="t3">
<text x="90" y="300" fill="#8AB4A5" font-size="16">CLASS&#160;&#160;&#160;: full-stack &#215; applied AI &#215; automation</text>
<text x="90" y="330" fill="#8AB4A5" font-size="16">SPAWN&#160;&#160;&#160;: wherever the real problem lives</text>
<text x="90" y="360" fill="#8AB4A5" font-size="16">QUEST&#160;&#160;&#160;: turn messy requirements into shipped systems</text>
</g>
<text x="90" y="412" fill="#5d7268" font-size="15" class="t4">press &#9660; scroll to begin the run<tspan class="cursor" fill="#3ECF8E">&#9608;</tspan></text>
</g>

<!-- RIGHT: pixel scene — engineer at battlestation -->
<g class="glow"><ellipse cx="1250" cy="290" rx="260" ry="150" fill="#12201a"/></g>
<g transform="translate(1050,150)">
<!-- monitor -->
<g>
<rect x="150" y="40" width="200" height="130" fill="#101714" stroke="#3ECF8E" stroke-width="3"/>
<rect x="165" y="58" width="120" height="8" fill="#3ECF8E" opacity="0.9"/>
<rect x="165" y="76" width="90" height="8" fill="#20805F"/>
<rect x="165" y="94" width="140" height="8" fill="#20805F"/>
<rect x="165" y="112" width="70" height="8" fill="#8AB4A5"/>
<rect x="165" y="130" width="110" height="8" fill="#20805F"/>
<rect x="230" y="170" width="30" height="16" fill="#22302a"/>
<rect x="200" y="186" width="90" height="10" fill="#22302a"/>
</g>
<!-- desk -->
<rect x="60" y="240" width="380" height="12" fill="#22302a"/>
<rect x="80" y="252" width="14" height="60" fill="#1a2620"/>
<rect x="406" y="252" width="14" height="60" fill="#1a2620"/>
<!-- coffee -->
<rect x="370" y="216" width="24" height="24" fill="#ECF4EF"/>
<rect x="394" y="222" width="8" height="10" fill="#ECF4EF"/>
<rect x="376" y="204" width="4" height="8" fill="#5d7268"/>
<rect x="384" y="200" width="4" height="12" fill="#5d7268"/>
<!-- engineer: seated, facing monitor (right) -->
<g class="bob">
<g transform="translate(40,120) scale(6)">
<!-- cap -->
<rect x="4" y="0" width="5" height="1" fill="#3ECF8E"/>
<rect x="4" y="1" width="6" height="1" fill="#3ECF8E"/>
<!-- head -->
<rect x="4" y="2" width="5" height="3" fill="#ECF4EF"/>
<rect x="8" y="3" width="1" height="1" fill="#0B0F0E"/>
<!-- torso -->
<rect x="3" y="5" width="6" height="4" fill="#20805F"/>
<!-- arm to keyboard -->
<rect x="9" y="7" width="4" height="1" fill="#20805F"/>
<rect x="13" y="7" width="1" height="1" fill="#ECF4EF"/>
<!-- legs seated -->
<rect x="4" y="9" width="5" height="1" fill="#ECF4EF"/>
<rect x="8" y="10" width="2" height="3" fill="#ECF4EF"/>
<rect x="8" y="13" width="3" height="1" fill="#3ECF8E"/>
</g>
</g>
<!-- chair -->
<rect x="30" y="200" width="14" height="70" fill="#1a2620"/>
<rect x="30" y="264" width="60" height="10" fill="#1a2620"/>
<!-- server rack right -->
<g transform="translate(470,120)">
<rect x="0" y="0" width="70" height="132" fill="#101714" stroke="#22302a" stroke-width="3"/>
<rect x="10" y="12" width="50" height="10" fill="#1a2620"/><rect x="50" y="12" width="6" height="10" fill="#3ECF8E"/>
<rect x="10" y="32" width="50" height="10" fill="#1a2620"/><rect x="50" y="32" width="6" height="10" fill="#20805F"/>
<rect x="10" y="52" width="50" height="10" fill="#1a2620"/><rect x="50" y="52" width="6" height="10" fill="#3ECF8E"/>
<rect x="10" y="72" width="50" height="10" fill="#1a2620"/><rect x="50" y="72" width="6" height="10" fill="#8AB4A5"/>
<rect x="10" y="92" width="50" height="10" fill="#1a2620"/><rect x="50" y="92" width="6" height="10" fill="#3ECF8E"/>
<rect x="10" y="112" width="50" height="10" fill="#1a2620"/><rect x="50" y="112" width="6" height="10" fill="#20805F"/>
</g>
</g>

<!-- ground -->
<rect x="0" y="462" width="1600" height="3" fill="#22302a"/>

<!-- journey map strip -->
<g class="mono">
<text x="90" y="505" fill="#5d7268" font-size="13" letter-spacing="2">RUN MAP:</text>
<rect x="210" y="499" width="1300" height="2" fill="#22302a"/>
<g class="wp"><rect x="230" y="493" width="14" height="14" rx="2" fill="#3ECF8E"/></g>
<text x="254" y="505" fill="#8AB4A5" font-size="13">00 spawn</text>
<rect x="450" y="493" width="14" height="14" rx="2" fill="#20805F"/>
<text x="474" y="505" fill="#5d7268" font-size="13">01 field</text>
<rect x="650" y="493" width="14" height="14" rx="2" fill="#20805F"/>
<text x="674" y="505" fill="#5d7268" font-size="13">02 build</text>
<rect x="850" y="493" width="14" height="14" rx="2" fill="#20805F"/>
<text x="874" y="505" fill="#5d7268" font-size="13">03 shipments</text>
<rect x="1090" y="493" width="14" height="14" rx="2" fill="#20805F"/>
<text x="1114" y="505" fill="#5d7268" font-size="13">04 toolkit</text>
<rect x="1290" y="493" width="14" height="14" rx="2" fill="#20805F"/>
<text x="1314" y="505" fill="#5d7268" font-size="13">05 proof</text>
</g>

<rect x="0" y="556" width="1600" height="4" fill="#3ECF8E"/>
</svg>
