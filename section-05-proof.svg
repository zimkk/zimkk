<svg width="1600" height="190" viewBox="0 0 1600 190" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs><style>
.mono { font-family: 'Courier New', Courier, monospace; }
.shine { animation: sh 2.8s ease-in-out infinite; }
.hold { animation: hold 2.4s steps(2) infinite; }
@keyframes sh { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
@keyframes hold { 50% { transform: translateY(-3px); } }
</style></defs>
<rect width="1600" height="190" fill="#0B0F0E"/>
<rect x="0" y="0" width="1600" height="3" fill="#22302a"/>

<rect x="60" y="150" width="560" height="3" fill="#22302a"/>

<!-- engineer holding shield aloft -->
<g class="hold">
<g transform="translate(200,66) scale(6)">
<rect x="4" y="0" width="5" height="1" fill="#3ECF8E"/>
<rect x="4" y="1" width="6" height="1" fill="#3ECF8E"/>
<rect x="4" y="2" width="5" height="3" fill="#ECF4EF"/>
<rect x="8" y="3" width="1" height="1" fill="#0B0F0E"/>
<rect x="3" y="5" width="6" height="4" fill="#20805F"/>
<rect x="9" y="2" width="1" height="3" fill="#20805F"/>
<rect x="4" y="9" width="2" height="4" fill="#ECF4EF"/>
<rect x="7" y="9" width="2" height="4" fill="#ECF4EF"/>
<rect x="3" y="13" width="3" height="1" fill="#3ECF8E"/>
<rect x="7" y="13" width="3" height="1" fill="#3ECF8E"/>
</g>
</g>
<!-- pixel shield -->
<g class="shine">
<g transform="translate(300,36) scale(6)">
<rect x="1" y="0" width="8" height="1" fill="#3ECF8E"/>
<rect x="0" y="1" width="10" height="4" fill="#3ECF8E"/>
<rect x="1" y="5" width="8" height="2" fill="#3ECF8E"/>
<rect x="2" y="7" width="6" height="1" fill="#3ECF8E"/>
<rect x="3" y="8" width="4" height="1" fill="#3ECF8E"/>
<rect x="4" y="2" width="2" height="3" fill="#0B0F0E"/>
<rect x="3" y="3" width="4" height="1" fill="#0B0F0E"/>
</g>
</g>
<!-- pixel trophy + graph mini -->
<g transform="translate(420,80)">
<rect x="0" y="0" width="44" height="14" fill="#101714" stroke="#22302a" stroke-width="2"/>
<rect x="10" y="14" width="24" height="8" fill="#101714" stroke="#22302a" stroke-width="2"/>
<rect x="16" y="22" width="12" height="26" fill="#20805F"/>
<rect x="6" y="48" width="32" height="8" fill="#22302a"/>
</g>
<g fill="#20805F">
<rect x="510" y="120" width="10" height="30"/>
<rect x="526" y="104" width="10" height="46"/>
<rect x="542" y="128" width="10" height="22"/>
<rect x="558" y="88" width="10" height="62" fill="#3ECF8E"/>
</g>

<!-- text -->
<g class="mono">
<text x="700" y="86" fill="#3ECF8E" font-size="15" letter-spacing="3">CHAPTER 05 / THE PROOF</text>
<text x="698" y="126" fill="#ECF4EF" font-size="30" font-weight="700" letter-spacing="2">RECEIPTS, NOT PROMISES</text>
<text x="700" y="158" fill="#5d7268" font-size="15">certifications &#183; commit history &#183; systems still running without me</text>
</g>

<g>
<rect x="1440" y="86" width="12" height="12" rx="2" fill="#3ECF8E"/>
<rect x="1462" y="86" width="12" height="12" rx="2" fill="#3ECF8E"/>
<rect x="1484" y="86" width="12" height="12" rx="2" fill="#3ECF8E"/>
<rect x="1506" y="86" width="12" height="12" rx="2" fill="#3ECF8E"/>
<rect x="1528" y="86" width="12" height="12" rx="2" fill="#3ECF8E"/>
</g>
<rect x="0" y="187" width="1600" height="3" fill="#22302a"/>
</svg>
