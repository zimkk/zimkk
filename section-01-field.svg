<svg width="1600" height="190" viewBox="0 0 1600 190" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs><style>
.mono { font-family: 'Courier New', Courier, monospace; }
.walk { animation: bob 0.9s steps(2) infinite; }
.sig { animation: sig 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
@keyframes sig { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }
</style></defs>
<rect width="1600" height="190" fill="#0B0F0E"/>
<rect x="0" y="0" width="1600" height="3" fill="#22302a"/>

<!-- scene: engineer walking toward village (the users) -->
<rect x="60" y="150" width="560" height="3" fill="#22302a"/>
<!-- walker -->
<g class="walk">
<g transform="translate(80,60) scale(6)">
<rect x="4" y="0" width="5" height="1" fill="#3ECF8E"/>
<rect x="4" y="1" width="6" height="1" fill="#3ECF8E"/>
<rect x="4" y="2" width="5" height="3" fill="#ECF4EF"/>
<rect x="8" y="3" width="1" height="1" fill="#0B0F0E"/>
<rect x="3" y="5" width="6" height="4" fill="#20805F"/>
<rect x="1" y="5" width="2" height="5" fill="#1a2620"/>
<rect x="9" y="6" width="2" height="1" fill="#20805F"/>
<rect x="4" y="9" width="2" height="4" fill="#ECF4EF"/>
<rect x="7" y="9" width="2" height="3" fill="#ECF4EF"/>
<rect x="3" y="13" width="3" height="1" fill="#3ECF8E"/>
<rect x="7" y="12" width="3" height="1" fill="#3ECF8E"/>
</g>
</g>
<!-- signal from walker -->
<g class="sig" fill="#3ECF8E">
<rect x="180" y="70" width="6" height="6"/><rect x="196" y="60" width="6" height="6"/><rect x="212" y="50" width="6" height="6"/>
</g>
<!-- village: user buildings with lit windows -->
<g>
<rect x="330" y="96" width="70" height="54" fill="#101714" stroke="#22302a" stroke-width="2"/>
<rect x="344" y="108" width="12" height="12" fill="#3ECF8E"/><rect x="368" y="108" width="12" height="12" fill="#1a2620"/>
<rect x="344" y="130" width="12" height="12" fill="#1a2620"/><rect x="368" y="130" width="12" height="12" fill="#3ECF8E"/>
<rect x="420" y="76" width="80" height="74" fill="#101714" stroke="#22302a" stroke-width="2"/>
<rect x="434" y="90" width="12" height="12" fill="#3ECF8E"/><rect x="458" y="90" width="12" height="12" fill="#3ECF8E"/><rect x="482" y="90" width="6" height="12" fill="#1a2620"/>
<rect x="434" y="114" width="12" height="12" fill="#1a2620"/><rect x="458" y="114" width="12" height="12" fill="#3ECF8E"/>
<rect x="520" y="106" width="60" height="44" fill="#101714" stroke="#22302a" stroke-width="2"/>
<rect x="534" y="118" width="12" height="12" fill="#3ECF8E"/><rect x="556" y="118" width="12" height="12" fill="#1a2620"/>
</g>

<!-- text -->
<g class="mono">
<text x="700" y="86" fill="#3ECF8E" font-size="15" letter-spacing="3">CHAPTER 01 / THE FIELD</text>
<text x="698" y="126" fill="#ECF4EF" font-size="30" font-weight="700" letter-spacing="2">GO WHERE THE PROBLEM LIVES</text>
<text x="700" y="158" fill="#5d7268" font-size="15">embed with users &#183; learn the real workflow &#183; earn the requirements</text>
</g>

<!-- chapter progress -->
<g>
<rect x="1440" y="86" width="12" height="12" rx="2" fill="#3ECF8E"/>
<rect x="1462" y="86" width="12" height="12" rx="2" fill="#1a2620"/>
<rect x="1484" y="86" width="12" height="12" rx="2" fill="#1a2620"/>
<rect x="1506" y="86" width="12" height="12" rx="2" fill="#1a2620"/>
<rect x="1528" y="86" width="12" height="12" rx="2" fill="#1a2620"/>
</g>
<rect x="0" y="187" width="1600" height="3" fill="#22302a"/>
</svg>
